name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      taut:
        description: Rebuild taut.js, the extensions and the userscript
        type: boolean
        default: true
      desktop:
        description: Rebuild the desktop installers
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Build & release
    needs: check
    runs-on: ubuntu-latest
    # a newer pending run replaces an older pending one, and its gate picks up the older one's bumps
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      desktop: ${{ steps.gate.outputs.desktop }}
      publish: ${{ steps.gate.outputs.publish }}
      desktop-tag: ${{ steps.desktop-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # version raises since the latest tag's commit, so a release job that failed or never ran leaves its bumps to the next run
      - id: gate
        env:
          FORCE_TAUT: ${{ inputs.taut }}
          FORCE_DESKTOP: ${{ inputs.desktop }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/releaseGate.ts

      - run: npm ci
        if: steps.gate.outputs.publish == 'true'

      - name: Build bundle, extensions and userscript
        if: steps.gate.outputs.taut == 'true'
        run: npm run build

      - name: Update rolling releases
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ensure() {
            gh release view "$1" >/dev/null 2>&1 ||
              gh release create "$1" --target "$GITHUB_SHA" --notes "" "${@:4}"
            gh release edit "$1" --title "$2" --notes-file "$3" "${@:4}"
          }
          cat > latest.md <<'MD'
          Rolling build of the main branch.

          - `taut.js` / `taut.debug.js`: the app bundle every loader fetches (`debug` carries sourcemaps)
          - `taut.user.js`: userscript; `taut-chrome.zip` / `taut-firefox.xpi`: browser extensions
          - Desktop installers are in the `desktop-v*` releases

          Install instructions are in the [README](https://github.com/jeremy46231/taut#quickstart).
          MD
          ensure latest "Latest build" latest.md --latest --prerelease=false

      - name: Attest build provenance
        if: steps.gate.outputs.taut == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/taut.js
            dist/taut.debug.js
            dist/userscript/*.user.js
            dist/extension/*.zip

      - name: Publish to latest release
        if: steps.gate.outputs.taut == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest --clobber \
            dist/taut.js \
            dist/taut.debug.js \
            dist/userscript/*.user.js \
            dist/extension/*.zip

      - name: Sign and publish the Firefox extension
        if: steps.gate.outputs.taut == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          UPDATES: ${{ github.server_url }}/${{ github.repository }}/releases/download/latest/taut-firefox-updates.json
        run: |
          version="$(jq -r .version extension/firefox/manifest.json)"
          # AMO refuses a version it has already signed
          published="$(curl -fsSL "$UPDATES" | jq -r '.addons[].updates[0].version')" ||
            published=""
          if [ "$version" = "$published" ]; then
            echo "Firefox $version is already signed and published"
            exit 0
          fi
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::warning::AMO_JWT_ISSUER not set; the latest release keeps signed Firefox ${published:-none}."
            exit 0
          fi
          npx --yes web-ext@10 sign \
            --source-dir dist/extension/firefox \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/extension/amo
          mkdir -p dist/extension/signed
          mv dist/extension/amo/*.xpi dist/extension/signed/taut-firefox.xpi
          cp dist/extension/taut-firefox-updates.json dist/extension/signed/
          gh release upload latest --clobber \
            dist/extension/signed/taut-firefox.xpi \
            dist/extension/signed/taut-firefox-updates.json

      - name: Create desktop release
        if: steps.gate.outputs.desktop == 'true'
        id: desktop-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-v$(jq -r .version desktop/package.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Desktop ${TAG#desktop-}" \
            --notes "Taut desktop ${TAG#desktop-}. See the [README](https://github.com/jeremy46231/taut#quickstart) to install, its links always get the newest installers."

      # the app files the `latest` release has, their versions baked into the Worker, desktop releases come from the legs' reports
      - name: Deploy taut.jer.app
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set"
            exit 0
          fi
          gh release download latest --dir dist --clobber \
            --pattern taut.js --pattern taut.debug.js
          gh release download latest --dir dist/userscript --clobber --pattern taut.user.js
          gh release download latest --dir dist/extension --clobber --pattern taut-chrome.zip
          gh release download latest --dir dist/extension/signed --clobber \
            --pattern taut-firefox.xpi --pattern taut-firefox-updates.json ||
            echo "::warning::could not fetch the signed Firefox files"
          npm run build -- versions server
          cat dist/server-versions.json
          npm run server:deploy

      # last, so if a step above fails the next run's gate still sees these bumps
      - name: Move the latest tag
        if: steps.gate.outputs.publish == 'true'
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

  release-desktop:
    name: Desktop (${{ matrix.platforms }})
    needs: release
    if: needs.release.outputs.desktop == 'true'
    # queued, not cancelled: a leg stopped mid-upload leaves a half-published desktop-v release
    concurrency:
      group: desktop ${{ matrix.platforms }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platforms: linux linux-arm
          - os: macos-latest
            platforms: win win-arm
          - os: macos-latest
            platforms: mac mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install packaging and native module build deps
        if: contains(matrix.platforms, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libx11-dev libxkbfile-dev

      # arm64 replacements for slack's native modules, see scripts/lib/natives.ts
      - name: Build native modules
        if: contains(matrix.platforms, 'linux-arm')
        run: npm run build:natives

      - name: Check for signing credentials
        if: contains(matrix.platforms, 'mac')
        id: signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CERT_P12 not set; macOS app will be ad-hoc signed and not notarized."
          fi
          if [ -n "$MAC_CERT_P12" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_API_KEY_P8 not set; macOS builds will NOT be notarized."
          fi

      - name: Set up macOS signing keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/taut-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/taut-cert.p12"

          echo "$MAC_CERT_P12" | base64 --decode > "$P12"

          # Create, configure and unlock a dedicated keychain
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import cert + private key; let codesign use the key non-interactively
          security import "$P12" -P "$MAC_CERT_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # macOS doesn't ship Developer ID intermediates, get them
          for ca in \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            https://www.apple.com/appleca/AppleIncRootCertificate.cer
          do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ca.cer" "$ca" \
              && security import "$RUNNER_TEMP/ca.cer" -k "$KEYCHAIN" \
              || echo "::warning::could not import $ca"
          done

          # Put our keychain first in the search list so it's discoverable
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning | grep -q "Developer ID Application:" \
            || { echo "::error::No valid Developer ID Application identity in the keychain"; exit 1; }

      - name: Write App Store Connect API key
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"

      - name: Build desktop
        env:
          CSC_KEYCHAIN: ${{ steps.signing.outputs.enabled == 'true' &&
            format('{0}/taut-signing.keychain-db', runner.temp) || '' }}
          APPLE_API_KEY: ${{ steps.signing.outputs.notarize == 'true' &&
            format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build -- desktop ${{ matrix.platforms }}

      - name: Verify macOS signature and notarization
        if: steps.signing.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          for dmg in dist/desktop/*.dmg; do
            echo "== $dmg"
            spctl --assess --type open --context context:primary-signature -v "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Build apt and dnf repositories
        if: contains(matrix.platforms, 'linux')
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::REPO_GPG_KEY not set; skipping apt/dnf repository metadata."
            exit 0
          fi
          sudo apt-get install -y createrepo-c
          echo "$REPO_GPG_KEY" | gpg --batch --import
          npm run repo

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/desktop/*

      - name: Publish desktop to ${{ needs.release.outputs.desktop-tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.desktop-tag }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          kept=""
          publish() {
            local name
            name="$(basename "$1")"
            if grep -qxF "$name" <<<"$existing"; then
              echo "$name is already published, keeping it"
              kept+="$name"$'\n'
              return
            fi
            if [[ "$name" == *.yml ]]; then
              # a file kept from an earlier run is another build than this yml
              # describes (its sha512 would fail every download)
              local ref stale=""
              while read -r ref; do
                if grep -qxF "$ref" <<<"$existing"; then stale="$stale $ref"; fi
              done < <(sed -nE "s/^ *(- )?(url|path): *['\"]?([^'\"]+)['\"]? *$/\3/p" "$1" | sort -u)
              if [ -n "$stale" ]; then
                echo "::warning::not publishing $name, it doesn't describe the published$stale; this platform won't update itself to ${TAG#desktop-v}"
                return
              fi
            fi
            gh release upload "$TAG" "$1"
          }
          # update ymls last, so it's only on the server once all the files it references are
          for file in dist/desktop/*; do
            if [[ "$file" != *.yml ]]; then publish "$file"; fi
          done
          # the apt and dnf indexes pin their packages by hash, so they need this run's packages
          if compgen -G 'dist/repo/*' >/dev/null; then
            if grep -qE '[.](deb|rpm)$' <<<"$kept"; then
              echo "::warning::not publishing the apt and dnf indexes, $TAG already has other builds of their packages"
            else
              for file in dist/repo/*; do publish "$file"; done
            fi
          fi
          for file in dist/desktop/*.yml; do
            if [ -f "$file" ]; then publish "$file"; fi
          done

      - name: Report ${{ needs.release.outputs.desktop-tag }} to taut.jer.app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reportDesktop.ts "${{ needs.release.outputs.desktop-tag }}"

      # the newest mac release taut.jer.app has, which a newer run's leg may already have reported
      - name: Publish the Homebrew cask
        if: contains(matrix.platforms, 'mac')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ github.repository_owner }}/homebrew-taut
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping the Homebrew cask."
            exit 0
          fi
          node scripts/cask.ts > taut.rb
          cat taut.rb
          version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' taut.rb)"
          sha="$( (gh api "repos/$TAP/contents/Casks/taut.rb" 2>/dev/null || true) | jq -r '.sha // empty')"
          gh api -X PUT "repos/$TAP/contents/Casks/taut.rb" \
            -f message="taut $version" \
            -f content="$(base64 < taut.rb | tr -d '\n')" \
            ${sha:+-f sha="$sha"}

  # after every leg, pins each platform's newest installer that taut.jer.app has
  pin-flake:
    name: Pin flake.nix
    needs: [release, release-desktop]
    if: >-
      !cancelled() && needs.release.result == 'success' &&
      needs.release.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pin-flake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # rewrites main's flake.nix through the contents API, see scripts/flake.ts
      # (a GITHUB_TOKEN commit doesn't retrigger this workflow, no inf loops)
      - name: Pin the desktop releases in flake.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # the sha makes the PUT fail if a push changed flake.nix since the GET
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/flake.nix?ref=main" > flake.json
            jq -r .content flake.json | base64 -d > flake.main.nix
            cp flake.main.nix flake.nix
            node scripts/flake.ts flake.nix
            if cmp -s flake.main.nix flake.nix; then
              echo "flake.nix already pins the published releases"
              exit 0
            fi
            versions="$(grep -oE 'version = "[^"]+"' flake.nix | cut -d'"' -f2 | sort -uV | paste -sd' ' -)"
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/flake.nix" \
              -f branch=main \
              -f message="nix: pin desktop $versions" \
              -f sha="$(jq -r .sha flake.json)" \
              -f content="$(base64 -w0 flake.nix)"; then
              exit 0
            fi
            echo "::warning::pinning flake.nix failed (attempt $attempt), retrying against main's newest copy"
          done
          exit 1
